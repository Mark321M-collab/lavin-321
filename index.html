
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Lavin ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="universe">

        <canvas id="stars"></canvas>

        <div class="intro" id="intro">
            <p class="small-text">A little something for you</p>
            <h1>For Lavin</h1>
            <p class="instruction">Something is waiting inside...</p>
        </div>

        <div class="envelope-container" id="envelope">
            <div class="envelope">
                <div class="envelope-back"></div>

                <div class="letter">
                    <div class="letter-text">FOR YOU ❤️</div>
                </div>

                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>
                <div class="seal">♥</div>
            </div>
        </div>

        <div id="love-particles"></div>

        <!-- WAIT MESSAGE -->
        <div class="wait-message" id="wait-message">
            <h1>WAIT LAVIN...</h1>
            <p>FOR A BIGGER SURPRISE ❤️</p>
        </div>

        <!-- PROPOSAL SCREEN -->
        <div class="proposal-screen" id="proposal-screen">

            <h1 class="babe-title">BABE ❤️</h1>

            <h2>Will you be my bebbbby?</h2>

            <div class="proposal-buttons">
                <button id="yes-button">YES ❤️</button>
                <button id="no-button">NO 🙈</button>
            </div>

        </div>

        <p class="click-text" id="click-text">CLICK TO OPEN</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
